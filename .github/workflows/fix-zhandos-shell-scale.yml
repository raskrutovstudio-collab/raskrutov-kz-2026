name: Fix Zhandos shell and scale

on:
  push:
    branches:
      - fix/zhandos-shell-scale

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: apply Zhandos homepage shell and scale') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zhandos-shell-scale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: node scripts/fix-zhandos-shell-scale.js
      - run: npm run quality:all
      - name: Commit changes
        run: |
          git config user.name "Raskrutov Recovery Bot"
          git config user.email "recovery-bot@raskrutov.local"
          git add site_mirror/keysy/partnery/index.html site_mirror/assets/css/case-study.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: apply Zhandos homepage shell and scale"
          git push origin HEAD:fix/zhandos-shell-scale
